# Production (Dokploy): pulls the image published by .github/workflows/docker.yml.
# Domain and HTTPS are configured in Dokploy, pointing at port 3000 of the "app" service.
services:
  app:
    image: ghcr.io/5ucr4m/tinfoil-store:${CARTUCHO_TAG:-latest}
    # Dokploy only runs "up -d": without this, a redeploy keeps the old "latest" image.
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Optional fixed public address (e.g. https://store.example.com). Leave it empty to build
      # links from each request: the LAN IP for Tinfoil, the tunnel's https domain for the
      # panel and the Google OAuth redirect.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Encrypts integration tokens and signs sessions/download links. Keep it stable:
      # changing it means reconnecting integrations. Generate with: openssl rand -hex 32
      APP_SECRET: ${APP_SECRET:?Defina APP_SECRET}
    volumes:
      - cartucho-data:/data
      # Game files for the "Pasta no servidor" destination. A host path
      # (e.g. /mnt/hd/switch) or the named volume below.
      - ${GAMES_PATH:-cartucho-games}:/data/games

volumes:
  cartucho-data:
  cartucho-games:
